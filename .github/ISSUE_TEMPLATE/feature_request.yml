name: Feature request
description: Propose a feature for the source-agnostic, self-hosted core.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior, not private deployment details.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety, privacy, and dependency impact
      description: Note filesystem writes, network access, external providers, formats, and new dependencies.
    validations:
      required: true
